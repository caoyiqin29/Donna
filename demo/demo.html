<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      position: relative;
      background: #10151c;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      letter-spacing: 0;
    }
    .scene { position: absolute; inset: 0; overflow: hidden; background: #151b23; }
    .ribbon {
      position: absolute;
      left: -150px;
      width: 820px;
      border-radius: 42%;
      filter: blur(34px);
      opacity: .62;
      will-change: transform;
    }
    .ribbon-blue { top: -40px; height: 230px; background: rgba(70,185,233,.52); transform: rotate(-13deg); }
    .ribbon-pink { top: 190px; height: 185px; background: rgba(241,91,154,.40); transform: rotate(17deg); }
    .ribbon-gold { top: 470px; height: 170px; background: rgba(242,183,5,.32); transform: rotate(-10deg); }
    .glass-sheet {
      position: absolute;
      left: -80px;
      top: 125px;
      width: 680px;
      height: 380px;
      border: 1px solid rgba(255,255,255,.30);
      border-radius: 46% 54% 40% 60%;
      background: rgba(255,255,255,.10);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.36), inset 0 -1px 0 rgba(255,255,255,.10);
      backdrop-filter: blur(42px) saturate(138%);
      transform: rotate(-8deg);
      will-change: transform;
    }
    .sheen {
      position: absolute;
      left: -160px;
      top: 305px;
      width: 840px;
      height: 74px;
      border-top: 1px solid rgba(255,255,255,.44);
      border-bottom: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.08);
      filter: blur(8px);
      transform: rotate(-18deg);
      will-change: transform;
    }
    .camera { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform; }
    .panel {
      --panel: #48494b;
      --text: #f0f3f7;
      --muted: #aeb7c5;
      --check: #8f9aa9;
      --menu: #303236;
      --menu-border: #555960;
      position: absolute;
      left: 65px;
      top: 40px;
      width: 390px;
      height: 600px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 20px 52px rgba(0,0,0,.22), 0 2px 8px rgba(0,0,0,.16);
      color: var(--text);
      will-change: left, top, width, height, border-radius;
    }
    .traffic { position: absolute; top: 14px; left: 14px; display: flex; gap: 8px; }
    .traffic span { position: relative; width: 12px; height: 12px; border-radius: 50%; }
    .red::after { content: "×"; position: absolute; inset: -3px 0 0; color: #7b1714; font: 700 10px/12px -apple-system, sans-serif; text-align: center; opacity: 0; }
    .red.hovered::after { opacity: 1; }
    .red { background: #ff5f57; }
    .yellow { background: #febc2e; }
    .green { background: #28c840; }
    .header { display: flex; align-items: center; justify-content: space-between; margin: 48px 32px 14px; height: 25px; }
    h1 { margin: 0; color: var(--text); font-size: 15px; line-height: 22px; font-weight: 650; }
    .tools { display: flex; align-items: center; gap: 6px; color: var(--muted); }
    .tool { position: relative; width: 28px; height: 24px; display: grid; place-items: center; border-radius: 7px; }
    .tool.active { color: var(--text); background: rgba(255,255,255,.10); }
    .tool svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .moon { display: none; }
    .list { position: relative; margin: 0 32px; height: 190px; }
    .todo {
      position: absolute;
      left: 0;
      display: grid;
      grid-template-columns: 20px 34px minmax(0,1fr);
      align-items: start;
      column-gap: 3px;
      width: 100%;
      min-height: 30px;
    }
    .check {
      width: 18px;
      height: 18px;
      margin-top: 3px;
      display: grid;
      place-items: center;
      border: 1.5px solid var(--check);
      border-radius: 50%;
      color: #fff;
      font-size: 12px;
      line-height: 1;
    }
    .priority {
      padding-left: 2px;
      font-family: "Avenir Next", "PingFang SC", sans-serif;
      font-size: 13px;
      line-height: 24px;
      font-weight: 700;
      font-style: oblique 7deg;
    }
    .p0 { color: #f15b9a; }
    .p1 { color: #f2b705; }
    .meeting { color: #46b9e9; font-weight: 600; font-style: oblique 2deg; }
    .title { padding: 1px 4px 1px 0; color: var(--text); font-size: 14px; line-height: 22px; font-weight: 450; }
    .done .check { border-color: #f2b705; background: #f2b705; }
    .done .title { color: var(--muted); }
    .caret { display: inline-block; width: 1.5px; height: 17px; margin-left: 1px; vertical-align: -3px; background: var(--text); }
    .priority-menu {
      position: absolute;
      left: 20px;
      top: 68px;
      z-index: 10;
      width: 74px;
      padding: 4px;
      overflow: hidden;
      border: 1px solid var(--menu-border);
      border-radius: 9px;
      background: var(--menu);
      box-shadow: 0 8px 20px rgba(0,0,0,.18);
      opacity: 0;
      transform: translateY(-3px);
    }
    .priority-menu.open { opacity: 1; transform: translateY(0); }
    .option { height: 30px; padding: 0 9px; border-radius: 4px; font: 600 13px/30px "Avenir Next", "PingFang SC", sans-serif; }
    .option.selected { background: rgba(255,255,255,.12); }
    .tooltip {
      position: absolute;
      z-index: 20;
      top: 82px;
      padding: 5px 8px;
      border-radius: 6px;
      background: #151619;
      color: #f6f7f8;
      font-size: 11px;
      line-height: 16px;
      white-space: nowrap;
      opacity: 0;
    }
    .tooltip::before { content: ""; position: absolute; top: -4px; left: 50%; width: 8px; height: 8px; background: #151619; transform: translateX(-50%) rotate(45deg); }
    .theme-tip { right: 70px; }
    .clear-tip { right: 20px; }
    .cursor {
      position: absolute;
      z-index: 30;
      width: 14px;
      height: 18px;
      opacity: 0;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,.35));
    }
    .cursor::before {
      content: "";
      position: absolute;
      width: 0;
      height: 0;
      border-top: 15px solid #fff;
      border-right: 10px solid transparent;
      transform: rotate(-20deg);
    }
    .cursor::after {
      content: "";
      position: absolute;
      left: 2px;
      top: 2px;
      width: 0;
      height: 0;
      border-top: 11px solid #202226;
      border-right: 7px solid transparent;
      transform: rotate(-20deg);
    }
    .bubble-count {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 1px;
      color: #f0f3f7;
      text-align: center;
      opacity: 0;
    }
    .bubble-count strong { font-size: 26px; line-height: .88; font-weight: 850; }
    .bubble-count small { color: #aeb7c5; font-size: 11px; line-height: 1; font-weight: 650; }
  </style>
</head>
<body>
  <main class="scene">
    <div class="ribbon ribbon-blue"></div>
    <div class="ribbon ribbon-pink"></div>
    <div class="ribbon ribbon-gold"></div>
    <div class="glass-sheet"></div>
    <div class="sheen"></div>
    <div class="camera">
  <section class="panel">
    <div class="traffic"><span class="red"></span><span class="yellow"></span><span class="green"></span></div>
    <header class="header">
      <h1>每日任务</h1>
      <div class="tools">
        <span class="tool theme-tool">
          <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M6.35 17.65l-1.42 1.42M19.07 4.93l-1.42 1.42"/></svg>
          <svg class="moon" viewBox="0 0 24 24"><path d="M20.7 15.1A8.5 8.5 0 0 1 8.9 3.3 8.5 8.5 0 1 0 20.7 15.1Z"/></svg>
        </span>
        <span class="tool"><svg viewBox="0 0 24 24"><path d="M4 7h8M4 12h6M4 17h4M17 5v14M14 16l3 3 3-3"/></svg></span>
        <span class="tool clear-tool"><svg viewBox="0 0 32 32"><path d="M13 14V6.7a3 3 0 0 1 6 0V14M8.5 14h15M9.5 14l-1.8 11h16.6l-1.8-11M12.8 25v-5.2M16 25v-5.2M19.2 25v-5.2"/></svg></span>
      </div>
    </header>
    <div class="tooltip theme-tip">切换到浅色</div>
    <div class="tooltip clear-tip">清理完成</div>
    <div class="list">
      <div class="todo task-a"><span class="check"><span class="tick"></span></span><span class="priority p0">P0</span><span class="title">提交周报 10:00</span></div>
      <div class="todo task-b"><span class="check"></span><span class="priority p1">P1</span><span class="title">回复项目邮件 14:30</span></div>
      <div class="todo task-c"><span class="check"></span><span class="priority task-c-priority p1">P1</span><span class="title"><span class="typed"></span><span class="caret"></span></span></div>
      <div class="priority-menu">
        <div class="option p0">P0</div><div class="option p1">P1</div><div class="option meeting">会议</div>
      </div>
    </div>
    <div class="cursor"></div>
    <div class="bubble-count"><strong>2</strong><small>待办</small></div>
  </section>
    </div>
  </main>
  <script>
    const frame = Number(new URLSearchParams(location.search).get('frame') || 0);
    const clamp = value => Math.max(0, Math.min(1, value));
    const ease = value => {
      const t = clamp(value);
      return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    };
    const lerp = (from, to, amount) => from + (to - from) * amount;
    const text = '整理明日计划 18:00';
    const openSize = ease((frame - 12) / 9);
    const openHeight = ease((frame - 20) / 9);
    const openProgress = Math.max(openSize, openHeight);
    const typedCount = Math.max(0, Math.min(text.length, frame - 32));
    const reorder = ease((frame - 53) / 7);
    const menuVisible = frame >= 67 && frame < 81;
    const meetingSelected = frame >= 78;
    const themeProgress = ease((frame - 92) / 9);
    const clearProgress = ease((frame - 112) / 7);
    const panel = document.querySelector('.panel');
    const taskA = document.querySelector('.task-a');
    const taskB = document.querySelector('.task-b');
    const taskC = document.querySelector('.task-c');
    const cursor = document.querySelector('.cursor');

    function mix(from, to, amount) {
      return `rgb(${from.map((value, i) => Math.round(value + (to[i] - value) * amount)).join(',')})`;
    }

    panel.style.setProperty('--panel', mix([72,73,75], [244,245,246], themeProgress));
    panel.style.setProperty('--text', mix([240,243,247], [41,45,51], themeProgress));
    panel.style.setProperty('--muted', mix([174,183,197], [119,127,137], themeProgress));
    panel.style.setProperty('--check', mix([143,154,169], [125,134,146], themeProgress));
    panel.style.setProperty('--menu', mix([48,50,54], [243,244,246], themeProgress));
    panel.style.setProperty('--menu-border', mix([85,89,96], [199,203,209], themeProgress));
    panel.style.borderColor = mix([95,96,99], [218,221,225], themeProgress);
    panel.style.boxShadow = `0 20px 52px rgba(0,0,0,${0.22 - themeProgress * 0.10}), 0 2px 8px rgba(0,0,0,.14)`;

    const width = lerp(68, 390, openSize);
    const height = lerp(68, 390, openSize) + lerp(0, 210, openHeight);
    panel.style.width = `${width}px`;
    panel.style.height = `${height}px`;
    panel.style.left = `${260 - width / 2}px`;
    panel.style.top = `${340 - height / 2}px`;
    panel.style.borderRadius = `${lerp(34, 16, openProgress)}px`;
    const contentOpacity = clamp((openHeight - .18) / .56);
    document.querySelectorAll('.traffic, .header, .list, .cursor').forEach(node => {
      node.style.opacity = String(contentOpacity);
    });
    document.querySelector('.bubble-count').style.opacity = String(1 - clamp(openSize / .62));

    let cameraScale = lerp(1.16, 1, openProgress);
    let cameraX = lerp(-6, 0, openProgress);
    let cameraY = lerp(10, 0, openProgress);
    const menuFocus = ease((frame - 62) / 8) * (1 - ease((frame - 82) / 7));
    const toolFocus = ease((frame - 85) / 8) * (1 - ease((frame - 105) / 8));
    const finishSettle = ease((frame - 119) / 12);
    cameraScale += menuFocus * .045 + toolFocus * .055;
    cameraX += menuFocus * 8 - toolFocus * 10;
    cameraY += menuFocus * -12 + toolFocus * 18;
    cameraScale = lerp(cameraScale, 1, finishSettle);
    cameraX = lerp(cameraX, 0, finishSettle);
    cameraY = lerp(cameraY, 0, finishSettle);
    document.querySelector('.camera').style.transform = `translate(${cameraX}px, ${cameraY}px) scale(${cameraScale})`;

    const drift = frame * .32;
    document.querySelector('.ribbon-blue').style.transform = `translate(${drift * .22}px, ${Math.sin(frame / 18) * 8}px) rotate(-13deg)`;
    document.querySelector('.ribbon-pink').style.transform = `translate(${-drift * .16}px, ${Math.cos(frame / 20) * 10}px) rotate(17deg)`;
    document.querySelector('.ribbon-gold').style.transform = `translate(${drift * .12}px, ${Math.sin(frame / 24) * 7}px) rotate(-10deg)`;
    document.querySelector('.glass-sheet').style.transform = `translate(${Math.sin(frame / 28) * 10}px, ${Math.cos(frame / 32) * 7}px) rotate(-8deg)`;
    document.querySelector('.sheen').style.transform = `translateX(${(frame - 40) * 1.1}px) rotate(-18deg)`;

    document.querySelector('.typed').textContent = text.slice(0, typedCount);
    taskC.style.opacity = frame < 30 ? '0' : '1';
    document.querySelector('.caret').style.opacity = frame >= 50 || frame % 6 >= 4 ? '0' : '1';

    taskA.style.transform = `translateY(${reorder * 80}px)`;
    taskB.style.transform = `translateY(${40 - reorder * 40}px)`;
    taskC.style.transform = `translateY(${80 - reorder * 40}px)`;
    if (reorder > 0) {
      taskA.classList.add('done');
      taskA.querySelector('.tick').textContent = '✓';
      taskA.querySelector('.check').style.background = '#f2b705';
      taskA.querySelector('.check').style.borderColor = '#f2b705';
      taskA.style.opacity = String((1 - reorder * .18) * (1 - clearProgress));
    }

    const menu = document.querySelector('.priority-menu');
    menu.classList.toggle('open', menuVisible);
    if (frame >= 75 && frame < 81) menu.querySelector('.meeting').classList.add('selected');
    if (meetingSelected) {
      const priority = document.querySelector('.task-c-priority');
      priority.textContent = '会议';
      priority.className = 'priority task-c-priority meeting';
    }

    const themeTool = document.querySelector('.theme-tool');
    const clearTool = document.querySelector('.clear-tool');
    const themeTip = document.querySelector('.theme-tip');
    const clearTip = document.querySelector('.clear-tip');
    if (frame >= 86 && frame < 102) {
      themeTool.classList.add('active');
      themeTip.style.opacity = '1';
      cursor.style.opacity = '1';
      cursor.style.left = '286px';
      cursor.style.top = '55px';
    }
    if (frame >= 100) {
      document.querySelector('.sun').style.display = 'none';
      document.querySelector('.moon').style.display = 'block';
      themeTip.textContent = '切换到深色';
    }
    if (frame >= 106 && frame < 121) {
      clearTool.classList.add('active');
      clearTip.style.opacity = '1';
      cursor.style.opacity = '1';
      cursor.style.left = '354px';
      cursor.style.top = '55px';
    }
    if (frame >= 67 && frame < 81) {
      cursor.style.opacity = '1';
      cursor.style.left = '87px';
      cursor.style.top = frame < 75 ? '139px' : '207px';
    }
  </script>
</body>
</html>
